name: Release

# Cuts a vX.Y.Z tag and GitHub Release for every push to main. The version is
# bumped from the latest tag using conventional commits since it:
# `type!:` or `BREAKING CHANGE` -> major, `feat` -> minor, anything else -> patch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Cut release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          semver='^v[0-9]+\.[0-9]+\.[0-9]+$'

          if git tag --points-at "$GITHUB_SHA" | grep -Eq "$semver"; then
            echo "Commit is already tagged; nothing to release."
            exit 0
          fi

          last="$(git tag --list 'v*' --sort=-v:refname | grep -E "$semver" | head -n 1 || true)"
          if [[ -z "$last" ]]; then
            next="v1.0.0"
          else
            IFS=. read -r major minor patch <<<"${last#v}"
            log="$(git log --format='%s%n%b' "${last}..${GITHUB_SHA}")"
            if grep -Eq '^[a-z]+(\([^)]*\))?!:|^BREAKING CHANGE' <<<"$log"; then
              next="v$((major + 1)).0.0"
            elif grep -Eq '^feat(\([^)]*\))?:' <<<"$log"; then
              next="v${major}.$((minor + 1)).0"
            else
              next="v${major}.${minor}.$((patch + 1))"
            fi
          fi

          gh release create "$next" --target "$GITHUB_SHA" --title "$next" --generate-notes
