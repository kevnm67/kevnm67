version: 2
updates:
- package-ecosystem: github-actions
  directory: "/"
  ignore:
  # Private repo Dependabot cannot read (git_dependencies_not_reachable); refs are @main.
  - dependency-name: kevnm67/engineering-toolkit
  schedule:
    interval: daily
    time: '09:00'
    timezone: America/New_York
  open-pull-requests-limit: 10
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    time: '08:00'
    timezone: America/New_York
  open-pull-requests-limit: 10
